services:
  - type: web
    name: westside-backend
    runtime: node
    rootDir: backend
    # Use `starter` or higher if you need always-on / more CPU; `free` spins down when idle.
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Do not set PORT here. Render injects PORT; the app must listen on process.env.PORT.
      - key: PROFILE_DB_MODE
        value: postgres
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_SUCCESS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_MS
        value: 86400000
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_ENABLED
        value: "true"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: APPROVAL_ADMIN_DISCORD_ID
        sync: false
      - key: APPROVAL_REQUEST_TIMEOUT_MS
        value: 300000
      - key: APPROVAL_ALLOW_ON_UNAVAILABLE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: westside-db
          property: connectionString

databases:
  - name: westside-db
    plan: free
